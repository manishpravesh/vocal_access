[global]
[global.environment]

[hasura]
version = "v2.33.0-ce"

[hasura.jwt]
secret = "{{NHOST_JWT_SECRET}}"
claims_namespace = "https://hasura.io/jwt/claims"

[functions]
[functions.node]
version = 18

[auth]
version = "0.32.1"

[auth.session]
[auth.session.accessToken]
expiresIn = 3600

[storage]
version = "0.3.5"
