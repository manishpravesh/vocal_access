table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        workflow_run:
          workflow:
            _and:
              - org_id:
                  _eq: X-Hasura-Org-Id
              - _exists:
                  _table:
                    name: org_members
                    schema: public
                  _where:
                    org_id:
                      _eq: X-Hasura-Org-Id
                    user_id:
                      _eq: X-Hasura-User-Id
event_triggers:
  - name: notify_step_handler
    definition:
      enable_manual: false
      update:
        columns:
          - status
    retry_conf:
      num_retries: 3
      interval_sec: 10
      timeout_sec: 60
    webhook: "{{NHOST_FUNCTIONS_URL}}/v1/notify-handler"
    headers:
      - name: x-hasura-admin-secret
        value_from_env: NHOST_ADMIN_SECRET
