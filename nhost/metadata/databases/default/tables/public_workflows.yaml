table:
  name: workflows
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        _and:
          - org_id:
              _eq: X-Hasura-Org-Id
          - _exists:
              _table:
                name: org_members
                schema: public
              _where:
                org_id:
                  _eq: X-Hasura-Org-Id
                user_id:
                  _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - org_id:
              _eq: X-Hasura-Org-Id
          - _exists:
              _table:
                name: org_members
                schema: public
              _where:
                org_id:
                  _eq: X-Hasura-Org-Id
                user_id:
                  _eq: X-Hasura-User-Id
                role:
                  _in: ["owner", "editor"]
      columns: '*'
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - description
        - is_active
      filter:
        _and:
          - org_id:
              _eq: X-Hasura-Org-Id
          - _exists:
              _table:
                name: org_members
                schema: public
              _where:
                org_id:
                  _eq: X-Hasura-Org-Id
                user_id:
                  _eq: X-Hasura-User-Id
                role:
                  _in: ["owner", "editor"]
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - org_id:
              _eq: X-Hasura-Org-Id
          - _exists:
              _table:
                name: org_members
                schema: public
              _where:
                org_id:
                  _eq: X-Hasura-Org-Id
                user_id:
                  _eq: X-Hasura-User-Id
                role:
                  _eq: owner
