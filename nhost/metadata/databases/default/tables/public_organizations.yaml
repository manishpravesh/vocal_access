table:
  name: organizations
  schema: public
object_relationships:
  - name: org_members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - slug
        - quota_limit
        - quota_used
        - quota_period_start
        - created_at
        - updated_at
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            org_id:
              _eq: X-Hasura-Org-Id
            user_id:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - slug
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            org_id:
              _eq: X-Hasura-Org-Id
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
      check: null
