table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        workflow:
          _and:
            - org_id:
                _eq: X-Hasura-Org-Id
            - _exists:
                _table:
                  name: org_members
                  schema: public
                _where:
                  org_id:
                    _eq: X-Hasura-Org-Id
                  user_id:
                    _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        workflow:
          _and:
            - org_id:
                _eq: X-Hasura-Org-Id
            - _exists:
                _table:
                  name: org_members
                  schema: public
                _where:
                  org_id:
                    _eq: X-Hasura-Org-Id
                  user_id:
                    _eq: X-Hasura-User-Id
                  role:
                    _in: ["owner", "editor"]
      columns: '*'
update_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        workflow:
          _and:
            - org_id:
                _eq: X-Hasura-Org-Id
            - _exists:
                _table:
                  name: org_members
                  schema: public
                _where:
                  org_id:
                    _eq: X-Hasura-Org-Id
                  user_id:
                    _eq: X-Hasura-User-Id
                  role:
                    _in: ["owner", "editor"]
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          _and:
            - org_id:
                _eq: X-Hasura-Org-Id
            - _exists:
                _table:
                  name: org_members
                  schema: public
                _where:
                  org_id:
                    _eq: X-Hasura-Org-Id
                  user_id:
                    _eq: X-Hasura-User-Id
                  role:
                    _in: ["owner", "editor"]
