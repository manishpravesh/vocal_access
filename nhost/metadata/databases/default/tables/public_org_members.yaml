table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - user_id
        - role
        - created_at
      filter:
        org_id:
          _eq: X-Hasura-Org-Id
insert_permissions:
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            org_id:
              _eq: X-Hasura-Org-Id
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
      columns:
        - org_id
        - user_id
        - role
update_permissions:
  - role: user
    permission:
      columns:
        - role
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            org_id:
              _eq: X-Hasura-Org-Id
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            org_id:
              _eq: X-Hasura-Org-Id
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
